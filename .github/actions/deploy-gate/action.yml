name: Deploy gate
description: Resolves whether this event may deploy, to which environment, and with which image tag.
inputs:
  allowed_branches:
    description: Newline separated glob patterns of pull request head branches that may deploy to stage
    required: false
    default: ""
outputs:
  deploy:
    description: "true when the event may deploy"
    value: ${{ steps.gate.outputs.deploy }}
  environment:
    description: GitHub environment to deploy to
    value: ${{ steps.gate.outputs.environment }}
  image_tag:
    description: Image tag for this deployment
    value: ${{ steps.gate.outputs.image_tag }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        ALLOWED_BRANCHES: ${{ inputs.allowed_branches }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        deploy=false
        environment=stage
        branch="$HEAD_REF"
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          deploy=true
          branch="$REF_NAME"
          if [ "$REF_NAME" = "master" ]; then environment=main; fi
        elif [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" = "$REPO" ]; then
          if [ "$EVENT_ACTION" = "closed" ]; then
            if [ "$PR_MERGED" = "true" ] && [ "$BASE_REF" = "master" ]; then
              deploy=true
              environment=main
              branch=master
            fi
          else
            while IFS= read -r pattern; do
              [ -n "$pattern" ] || continue
              case "$HEAD_REF" in
                $pattern) deploy=true ;;
              esac
            done <<< "$ALLOWED_BRANCHES"
          fi
        fi
        image_tag=""
        if [ "$deploy" = "true" ]; then
          image_tag="$(python3 "$ACTION_PATH/../../../scripts/image_tag.py" "$branch")"
        fi
        {
          echo "deploy=$deploy"
          echo "environment=$environment"
          echo "image_tag=$image_tag"
        } >> "$GITHUB_OUTPUT"
