name: Build & Push Powerlifting Images

on:
  push:
    branches: ['**']
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/dependencies/**"
      - "src/services/**"
      - "src/lambda/**"
      - "docker/**"
      - "terraform/**"
      - "deploy/argocd/**"
      - "src/package.json"
      - "src/package-lock.json"
      - "src/tsconfig.json"
      - "scripts/image_tag.py"
      - "scripts/migrate_identity_pointers.py"
      - "scripts/verify_workload_identity.py"
      - "scripts/k3s-workload-identity*"
      - "scripts/k3s-home-tailnet-setup.sh"
      - "scripts/verify_network_canary.py"
      - "scripts/test_verify_*.py"
      - ".github/workflows/**"
      - ".github/image-filters.yml"
      - "!**/*.md"

  workflow_dispatch:
    inputs:
      backend_only:
        description: Build only backend
        required: false
        default: "false"
      frontend_only:
        description: Build only frontend
        required: false
        default: "false"
      apply_terraform:
        description: Run terraform apply (workflow_dispatch only)
        required: false
        default: "false"

concurrency:
  group: powerlifting-release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  AWS_REGION: ca-central-1
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}
  ECR_REPO_PREFIX: if
  TF_VERSION: "1.15.x"

jobs:
  changes:
    if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
      services: ${{ steps.result.outputs.services }}
      terraform: ${{ steps.result.outputs.terraform }}
      kubernetes: ${{ steps.result.outputs.kubernetes }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      live_release: ${{ steps.release.outputs.live_release }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          OWNER_RELEASE: >-
            ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
              && (github.event_name == 'push' || (inputs.apply_terraform == 'true'
                && (github.ref_name == 'master' || (inputs.backend_only != 'true' && inputs.frontend_only != 'true')))) }}
        run: |
          image_tag="$(python3 scripts/image_tag.py "$RELEASE_BRANCH")"
          live_release=false
          if [[ "$OWNER_RELEASE" == true && ( "$RELEASE_BRANCH" == master || "$RELEASE_BRANCH" == feature/* ) ]]; then
            image_tag=latest
            live_release=true
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "live_release=$live_release" >> "$GITHUB_OUTPUT"

      - id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          LIVE_RELEASE: ${{ steps.release.outputs.live_release }}
        run: |
          open_prs=0
          if [ "${{ github.event_name }}" = "push" ] && [ "$BRANCH" != "master" ]; then
            open_prs="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq length)"
          fi
          if [ "$LIVE_RELEASE" = true ] || [ "$open_prs" -gt 0 ] \
            || { [ "${{ github.event_name }}" = "push" ] && [ "$BRANCH" = "master" ]; } \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply_terraform }}" = "true" ]; } \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.frontend_only }}" = "true" ] && [ "${{ inputs.backend_only }}" != "true" ] && [ "${{ inputs.apply_terraform }}" != "true" ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: .github/image-filters.yml

      - id: result
        shell: bash
        run: |
          {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "frontend=true"
              if [ "${{ inputs.frontend_only }}" = "true" ] && [ "${{ inputs.backend_only }}" != "true" ] && [ "${{ inputs.apply_terraform }}" != "true" ]; then
                echo "backend=false"
                echo "services=false"
                echo "terraform=false"
                echo "kubernetes=false"
              else
                echo "backend=true"
                echo "services=true"
                echo "terraform=true"
                echo "kubernetes=true"
              fi
            else
              echo "backend=${{ steps.filter.outputs.backend }}"
              echo "frontend=${{ steps.filter.outputs.frontend }}"
              echo "services=${{ steps.filter.outputs.services }}"
              echo "terraform=${{ steps.filter.outputs.terraform }}"
              echo "kubernetes=${{ steps.filter.outputs.kubernetes }}"
            fi
          } >> "$GITHUB_OUTPUT"

  build-backend:
    needs: [changes, terraform-apply]
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        && !(github.event_name == 'workflow_dispatch' && inputs.frontend_only == 'true')
        && (needs.changes.outputs.live_release != 'true' || needs.changes.outputs.terraform != 'true' || needs.terraform-apply.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - working-directory: docker
        run: packer init powerlifting-backend.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-powerlifting-app-backend" \
            -var "image_tag=${{ needs.changes.outputs.image_tag }}" \
            powerlifting-backend.pkr.hcl

  build-services:
    needs: [changes, terraform-apply]
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.services == 'true'
        && !(github.event_name == 'workflow_dispatch' && inputs.frontend_only == 'true')
        && needs.terraform-apply.result != 'failure' && needs.terraform-apply.result != 'cancelled'
        && (needs.changes.outputs.live_release != 'true' || needs.changes.outputs.terraform != 'true' || needs.terraform-apply.result == 'success') }}
    strategy:
      matrix:
        include:
          - image: powerlifting-services
            repository: powerlifting-fns
          - image: powerlifting-analytics
            repository: powerlifting-analytics
          - image: powerlifting-rankings
            repository: powerlifting-rankings
          - image: powerlifting-analytics-ai
            repository: powerlifting-analytics-ai
          - image: powerlifting-prompt-cache-api
            repository: powerlifting-prompt-cache-api
          - image: powerlifting-analytics-export
            repository: powerlifting-analytics-export
          - image: powerlifting-sessions
            repository: powerlifting-sessions
          - image: powerlifting-program
            repository: powerlifting-program
          - image: powerlifting-performance
            repository: powerlifting-performance
          - image: powerlifting-federation
            repository: powerlifting-federation
          - image: powerlifting-goals
            repository: powerlifting-goals
          - image: powerlifting-export
            repository: powerlifting-export
          - image: powerlifting-imports
            repository: powerlifting-imports
          - image: powerlifting-templates
            repository: powerlifting-templates
          - image: powerlifting-lift-profiles
            repository: powerlifting-lift-profiles
          - image: powerlifting-weight-log
            repository: powerlifting-weight-log
          - image: powerlifting-calculations
            repository: powerlifting-calculations
          - image: powerlifting-competition
            repository: powerlifting-competition
          - image: powerlifting-profile
            repository: powerlifting-profile
          - image: powerlifting-glossary
            repository: powerlifting-glossary
          - image: powerlifting-coach-discord
            repository: powerlifting-coach-discord
          - image: powerlifting-assistant
            repository: powerlifting-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - working-directory: docker
        run: packer init ${{ matrix.image }}.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-${{ matrix.repository }}" \
            -var "image_tag=${{ needs.changes.outputs.image_tag }}" \
            ${{ matrix.image }}.pkr.hcl

  build-frontend:
    needs: [changes, terraform-apply]
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        && !(github.event_name == 'workflow_dispatch' && inputs.backend_only == 'true')
        && (needs.changes.outputs.live_release != 'true' || needs.changes.outputs.terraform != 'true' || needs.terraform-apply.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      # Read the CloudFront media base URL from the terraform remote state so
      # the frontend build can bake it into the CSP media-src allowlist. The
      # state already reflects the applied CloudFront distribution from prior
      # terraform runs, so this does not require a fresh apply in this run.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Read CloudFront media base URL from terraform output
        id: tfout
        working-directory: terraform
        run: |
          terraform init -input=false
          MEDIA_URL=$(terraform output -raw cloudfront_media_base_url)
          echo "cloudfront_media_base_url=$MEDIA_URL" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - working-directory: docker
        run: packer init powerlifting-frontend.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-powerlifting-app-frontend" \
            -var "image_tag=${{ needs.changes.outputs.image_tag }}" \
            -var "api_url=/api" \
            -var "cloudfront_media_base_url=${{ steps.tfout.outputs.cloudfront_media_base_url }}" \
            powerlifting-frontend.pkr.hcl

  terraform-validate:
    needs: changes
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - working-directory: terraform
        run: terraform init -input=false

      - working-directory: terraform
        run: terraform validate

      - working-directory: terraform/k8s/nodes
        run: |
          terraform init -backend=false -input=false
          terraform validate

  workload-identity-inputs:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.terraform == 'true'
        && github.actor == github.repository_owner
        && github.triggering_actor == github.repository_owner }}
    runs-on: powerlifting-k8s
    outputs:
      jwks: ${{ steps.discovery.outputs.jwks }}
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.5
      - id: discovery
        run: |
          set -euo pipefail
          umask 077
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          cat > "$kubeconfig" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - name: in-cluster
            cluster:
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              server: https://kubernetes.default.svc
          contexts:
          - name: runner
            context:
              cluster: in-cluster
              user: runner
          current-context: runner
          users:
          - name: runner
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          EOF
          jwks="$(kubectl --kubeconfig "$kubeconfig" get --raw /openid/v1/jwks | jq -ce '{keys: [.keys[] | {kid, kty, alg, use, n, e}]} | select(.keys | length > 0)')"
          printf 'jwks=%s\n' "$jwks" >> "$GITHUB_OUTPUT"

  terraform-plan:
    needs: [terraform-validate, workload-identity-inputs]
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: ubuntu-latest
    if: ${{ needs.terraform-validate.result == 'success' && needs.workload-identity-inputs.result == 'success' }}
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tunnel_origin_url: ${{ vars.TUNNEL_ORIGIN_URL }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_app_zone: ${{ vars.APP_ZONE }}
      TF_VAR_cloudflare_zone_plan: ${{ vars.CLOUDFLARE_ZONE_PLAN }}
      TF_VAR_auth_domain: ${{ vars.AUTH_DOMAIN }}
      TF_VAR_llm_domain: ${{ vars.LLM_DOMAIN }}
      TF_VAR_argocd_domain: ${{ vars.ARGOCD_DOMAIN }}
      TF_VAR_litellm_provider_keys: ${{ secrets.LITELLM_PROVIDER_KEYS }}
      TF_VAR_glossary_table_name: ${{ vars.GLOSSARY_TABLE_NAME }}
      TF_VAR_glossary_catalog_function_name: ${{ vars.GLOSSARY_CATALOG_FUNCTION_NAME }}
      TF_VAR_workload_identity_jwks: ${{ needs.workload-identity-inputs.outputs.jwks }}
      TF_VAR_workers_enabled: ${{ vars.WORKERS_ENABLED || 'false' }}
      TF_VAR_worker_desired: ${{ vars.WORKER_DESIRED || '0' }}
      TF_VAR_home_lan_cidr: ${{ secrets.HOME_LAN_CIDR }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/lambda/glossary-catalog/go.mod
          cache-dependency-path: src/lambda/glossary-catalog/go.sum

      - name: Build glossary catalog lambda
        working-directory: src/lambda/glossary-catalog
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o dist/bootstrap . && cd dist && zip bootstrap.zip bootstrap

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - working-directory: terraform
        run: terraform init -input=false

      - working-directory: terraform
        run: terraform plan -input=false -no-color -var="region=${{ env.AWS_REGION }}"

  terraform-apply:
    needs: [changes, terraform-plan, workload-identity-inputs]
    outputs:
      workload_issuer: ${{ steps.apply.outputs.workload_issuer }}
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.live_release == 'true' && needs.changes.outputs.deploy == 'true' && needs.terraform-plan.result == 'success' }}
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tunnel_origin_url: ${{ vars.TUNNEL_ORIGIN_URL }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_app_zone: ${{ vars.APP_ZONE }}
      TF_VAR_cloudflare_zone_plan: ${{ vars.CLOUDFLARE_ZONE_PLAN }}
      TF_VAR_auth_domain: ${{ vars.AUTH_DOMAIN }}
      TF_VAR_llm_domain: ${{ vars.LLM_DOMAIN }}
      TF_VAR_argocd_domain: ${{ vars.ARGOCD_DOMAIN }}
      TF_VAR_litellm_provider_keys: ${{ secrets.LITELLM_PROVIDER_KEYS }}
      TF_VAR_glossary_table_name: ${{ vars.GLOSSARY_TABLE_NAME }}
      TF_VAR_glossary_catalog_function_name: ${{ vars.GLOSSARY_CATALOG_FUNCTION_NAME }}
      TF_VAR_workload_identity_jwks: ${{ needs.workload-identity-inputs.outputs.jwks }}
      TF_VAR_workers_enabled: ${{ vars.WORKERS_ENABLED || 'false' }}
      TF_VAR_worker_desired: ${{ vars.WORKER_DESIRED || '0' }}
      TF_VAR_home_lan_cidr: ${{ secrets.HOME_LAN_CIDR }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/lambda/glossary-catalog/go.mod
          cache-dependency-path: src/lambda/glossary-catalog/go.sum

      - name: Build glossary catalog lambda
        working-directory: src/lambda/glossary-catalog
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o dist/bootstrap . && cd dist && zip bootstrap.zip bootstrap

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - working-directory: terraform
        run: terraform init -input=false

      - id: apply
        working-directory: terraform
        run: |
          umask 077
          terraform plan -input=false -no-color -var="region=${{ env.AWS_REGION }}" -out="$RUNNER_TEMP/aws.tfplan"
          terraform apply -input=false -no-color "$RUNNER_TEMP/aws.tfplan"
          printf 'workload_issuer=%s\n' "$(terraform output -raw workload_identity_issuer)" >> "$GITHUB_OUTPUT"

  kubernetes-apply:
    needs: [changes, terraform-apply, build-backend, build-services, build-frontend]
    environment: ${{ github.ref_name == 'master' && 'main' || 'stage' }}
    runs-on: powerlifting-k8s
    if: >-
      ${{ always() && needs.changes.outputs.live_release == 'true'
        && (needs.changes.outputs.kubernetes == 'true' || startsWith(github.ref_name, 'feature/'))
        && needs.changes.outputs.deploy == 'true'
        && github.triggering_actor == github.repository_owner && github.actor == github.repository_owner
        && (github.ref_name == 'master'
          || ((needs.changes.outputs.backend != 'true' || needs.build-backend.result == 'success')
            && (needs.changes.outputs.services != 'true' || needs.build-services.result == 'success')
            && (needs.changes.outputs.frontend != 'true' || needs.build-frontend.result == 'success')))
        && (needs.changes.outputs.terraform != 'true' || needs.terraform-apply.result == 'success') }}
    concurrency:
      group: kubernetes-apply
      cancel-in-progress: false
    env:
      KUBE_LOAD_CONFIG_FILE: "false"
      TF_VAR_workers_enabled: ${{ vars.WORKERS_ENABLED || 'false' }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TF_VAR_argocd_domain: ${{ vars.ARGOCD_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - run: command -v unzip || (sudo apt-get update && sudo apt-get install -y unzip)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install boto3==1.42.83 PyYAML==6.0.3

      - name: Preserve existing identity pointers
        run: |
          python scripts/migrate_identity_pointers.py
          python scripts/migrate_identity_pointers.py --apply

      - env:
          K8S_TFVARS: ${{ secrets.K8S_TFVARS }}
        run: |
          umask 077
          printf '%s' "$K8S_TFVARS" > "$RUNNER_TEMP/k8s.tfvars"

      - env:
          COACH_TFVARS: ${{ secrets.COACH_TFVARS }}
        run: |
          umask 077
          test -n "$COACH_TFVARS" || { echo "COACH_TFVARS Actions secret is required to deploy the Coach images" >&2; exit 1; }
          printf '%s' "$COACH_TFVARS" > "$RUNNER_TEMP/coach.tfvars"

      - name: Configure kubectl for the in-cluster runner
        run: |
          cat > "$RUNNER_TEMP/kubeconfig" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - name: in-cluster
            cluster:
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              server: https://kubernetes.default.svc
          contexts:
          - name: runner
            context:
              cluster: in-cluster
              user: runner
          current-context: runner
          users:
          - name: runner
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          EOF
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Configure the k3s workload issuer
        if: ${{ needs.terraform-apply.result == 'success' }}
        env:
          WORKLOAD_IDENTITY_ISSUER: ${{ needs.terraform-apply.outputs.workload_issuer }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/k3s-workload-issuer.json"
          bash scripts/k3s-workload-identity-plan.sh "$WORKLOAD_IDENTITY_ISSUER" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$manifest"
          if [ -s "$manifest" ]; then
            kubectl apply -f "$manifest"
            for _ in {1..90}; do
              if kubectl --request-timeout=5s get --raw /.well-known/openid-configuration 2>/dev/null |
                jq -e --arg issuer "$WORKLOAD_IDENTITY_ISSUER" '.issuer == $issuer and .jwks_uri == ($issuer + "/openid/v1/jwks")' >/dev/null; then
                break
              fi
              sleep 5
            done
            kubectl --request-timeout=15s get --raw /.well-known/openid-configuration |
              jq -e --arg issuer "$WORKLOAD_IDENTITY_ISSUER" '.issuer == $issuer and .jwks_uri == ($issuer + "/openid/v1/jwks")' >/dev/null
            kubectl wait --for=condition=Complete --timeout=120s -f "$manifest"
            kubectl --request-timeout=15s get --raw /readyz >/dev/null
            kubectl wait --for=condition=Ready --timeout=120s node -l node-role.kubernetes.io/control-plane
          fi

      - name: Reconcile platform infrastructure
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          for stack in core perms network mesh app coach; do
            directory="terraform/k8s/$stack"
            key="powerlifting-app/k8s/$stack.tfstate"
            variables="$RUNNER_TEMP/k8s.tfvars"
            if [[ $stack == coach ]]; then
              directory=terraform/coach
              key=powerlifting-app/coach/terraform.tfstate
              variables="$RUNNER_TEMP/coach.tfvars"
            fi
            terraform -chdir="$directory" init -input=false -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=$key" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
            terraform -chdir="$directory" apply -input=false -auto-approve -compact-warnings -var-file="$variables"
          done

      - name: Reconcile NoLift applications
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_argocd_target_revision: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/k8s/argocd init -input=false -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=powerlifting-app/k8s/argocd.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

          TF_VAR_app_inputs=$(terraform -chdir=terraform/k8s/app output -json manifest_inputs)
          TF_VAR_coach_inputs=$(terraform -chdir=terraform/coach output -json manifest_inputs)
          TF_VAR_network_inputs=$(terraform -chdir=terraform/k8s/network output -json manifest_inputs)
          TF_VAR_argocd_client_secret=$(terraform -chdir=terraform/k8s/core output -raw argocd_client_secret)
          export TF_VAR_app_inputs TF_VAR_coach_inputs TF_VAR_network_inputs TF_VAR_argocd_client_secret

          updater=deployment/argocd-image-updater-controller
          resume_image_updater() {
            if [[ -n $(kubectl -n argocd get applications.argoproj.io nolift-app -o jsonpath='{.spec.syncPolicy.automated}') ]]; then
              kubectl -n argocd scale "$updater" --replicas=1
            fi
          }
          if [[ $(kubectl -n argocd get "$updater" --ignore-not-found -o jsonpath='{.spec.replicas}') == 1 ]]; then
            trap resume_image_updater EXIT
            kubectl -n argocd scale "$updater" --replicas=0
            kubectl -n argocd wait --for=delete pod -l app.kubernetes.io/name=argocd-image-updater --timeout=2m
          fi

          terraform -chdir=terraform/k8s/argocd apply -input=false -compact-warnings -auto-approve \
            -var-file="$RUNNER_TEMP/k8s.tfvars" > /dev/null

      - name: Reconcile worker infrastructure
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform/k8s/nodes init -input=false -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=powerlifting-app/k8s/nodes.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=terraform/k8s/nodes apply -input=false -auto-approve -compact-warnings -var-file="$RUNNER_TEMP/k8s.tfvars"

      - name: Wait for home server Tailscale setup
        if: ${{ vars.WORKERS_ENABLED == 'true' }}
        run: sh scripts/k3s-home-tailnet-setup.sh

      - name: Verify Argo CD login through the gateway
        env:
          ARGOCD_DOMAIN: ${{ vars.ARGOCD_DOMAIN }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
        run: |
          set -euo pipefail
          kubectl -n argocd get configmap argocd-cm -o json | jq -e '.data["admin.enabled"] == "false"' > /dev/null
          issuer="https://$AUTH_DOMAIN/application/o/argocd/"
          authorize=$(curl -fsS --retry 4 --retry-all-errors "${issuer}.well-known/openid-configuration" | jq -er --arg issuer "$issuer" 'select(.issuer == $issuer).authorization_endpoint')
          redirect=$(curl -fsS --retry 4 --retry-all-errors -o /dev/null -w '%{redirect_url}' "https://$ARGOCD_DOMAIN/auth/login")
          [[ $redirect == "$authorize?"* && $redirect == *"client_id=nolift-argocd"* ]]

      - name: Verify Istio
        run: |
          kubectl -n istio-system rollout status daemonset/istio-cni-node --timeout=600s
          kubectl -n istio-system rollout status daemonset/ztunnel --timeout=600s
          kubectl -n istio-system rollout status deployment/istiod --timeout=600s

      - name: Verify projected AWS trust
        run: |
          set -euo pipefail
          namespace="$(terraform -chdir=terraform/k8s/core output -raw namespace)"
          role="$(kubectl -n "$namespace" get deployment pl-rankings -o json | jq -r '.spec.template.spec.containers[].env[]? | select(.name == "AWS_ROLE_ARN") | .value')"
          python3 scripts/verify_workload_identity.py \
            --namespace "$namespace" --region "$AWS_REGION" \
            --service-account pl-rankings --role-arn "$role"

