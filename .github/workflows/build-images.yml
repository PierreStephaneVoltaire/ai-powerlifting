name: Build & Push Powerlifting Images

on:
  push:
    branches: [master, main]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/dependencies/**"
      - "src/services/**"
      - "src/lambda/**"
      - "docker/**"
      - "terraform/**"
      - "src/package.json"
      - "src/package-lock.json"
      - "src/tsconfig.json"
      - ".github/workflows/build-images.yml"

  pull_request:
    branches: [master, main]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/dependencies/**"
      - "src/services/**"
      - "src/lambda/**"
      - "docker/**"
      - "terraform/**"
      - ".github/workflows/build-images.yml"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: branch name)"
        required: false
      backend_only:
        description: Build only backend
        required: false
        default: "false"
      frontend_only:
        description: Build only frontend
        required: false
        default: "false"
      apply_terraform:
        description: Run terraform apply (workflow_dispatch only)
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPO_PREFIX: if
  TF_VERSION: "1.15.x"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
      services: ${{ steps.result.outputs.services }}
      terraform: ${{ steps.result.outputs.terraform }}
      kubernetes: ${{ steps.result.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/backend/**'
              - 'src/dependencies/**'
              - 'src/services/**'
              - 'docker/**'
              - 'src/package.json'
              - 'src/package-lock.json'
              - 'src/tsconfig.json'
              - '.github/workflows/build-images.yml'
            frontend:
              - 'src/frontend/**'
              - 'src/dependencies/**'
              - 'docker/**'
              - 'src/package.json'
              - 'src/package-lock.json'
              - 'src/tsconfig.json'
              - '.github/workflows/build-images.yml'
            services:
              - 'src/services/**'
              - 'src/backend/src/**'
              - 'src/backend/package.json'
              - 'src/backend/tsconfig.json'
              - 'src/dependencies/**'
              - 'src/package.json'
              - 'src/package-lock.json'
              - 'src/tsconfig.json'
              - 'src/frontend/package.json'
              - '.github/workflows/build-images.yml'
            kubernetes:
              - 'terraform/k8s/**'
            terraform:
              - 'terraform/**'
              - 'src/lambda/**'
              - 'src/services/lib/media_notifications.py'
              - '.github/workflows/build-images.yml'

      - id: result
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "services=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "kubernetes=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "services=${{ steps.filter.outputs.services }}" >> "$GITHUB_OUTPUT"
            echo "terraform=${{ steps.filter.outputs.terraform }}" >> "$GITHUB_OUTPUT"
            echo "kubernetes=${{ steps.filter.outputs.kubernetes }}" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.backend == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.frontend_only == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - working-directory: docker
        run: packer init powerlifting-backend.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-powerlifting-app-backend" \
            -var "image_tag=${{ steps.tag.outputs.value }}" \
            powerlifting-backend.pkr.hcl

  build-services:
    needs: [changes, terraform-apply]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.changes.outputs.services == 'true' && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.frontend_only == 'true') && needs.terraform-apply.result != 'failure' && needs.terraform-apply.result != 'cancelled' }}
    strategy:
      matrix:
        include:
          - image: powerlifting-services
            repository: powerlifting-fns
          - image: powerlifting-analytics
            repository: powerlifting-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - id: tag
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          echo "value=${TAG:-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"

      - working-directory: docker
        run: packer init ${{ matrix.image }}.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-${{ matrix.repository }}" \
            -var "image_tag=${{ steps.tag.outputs.value }}" \
            ${{ matrix.image }}.pkr.hcl

  build-coach:
    needs: [changes, terraform-apply]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.changes.outputs.services == 'true' && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.frontend_only == 'true') && needs.terraform-apply.result != 'failure' && needs.terraform-apply.result != 'cancelled' }}
    strategy:
      matrix:
        image: [powerlifting-coach-agent, powerlifting-coach-discord]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - id: tag
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          echo "value=${TAG:-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"

      - working-directory: docker
        run: packer init ${{ matrix.image }}.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-${{ matrix.image }}" \
            -var "image_tag=${{ steps.tag.outputs.value }}" \
            ${{ matrix.image }}.pkr.hcl

  build-frontend:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.frontend == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.backend_only == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      # Read the CloudFront media base URL from the terraform remote state so
      # the frontend build can bake it into the CSP media-src allowlist. The
      # state already reflects the applied CloudFront distribution from prior
      # terraform runs, so this does not require a fresh apply in this run.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Read CloudFront media base URL from terraform output
        id: tfout
        working-directory: terraform
        run: |
          terraform init -input=false
          MEDIA_URL=$(terraform output -raw cloudfront_media_base_url)
          echo "cloudfront_media_base_url=$MEDIA_URL" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.13.x

      - id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - working-directory: docker
        run: packer init powerlifting-frontend.pkr.hcl

      - working-directory: docker
        run: |
          packer build -color=false \
            -var "image_repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-powerlifting-app-frontend" \
            -var "image_tag=${{ steps.tag.outputs.value }}" \
            -var "api_url=/api" \
            -var "cloudfront_media_base_url=${{ steps.tfout.outputs.cloudfront_media_base_url }}" \
            powerlifting-frontend.pkr.hcl

  terraform-validate:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - working-directory: terraform
        run: terraform init -input=false

      - working-directory: terraform
        run: terraform validate

  terraform-plan:
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: ${{ needs.terraform-validate.result == 'success' }}
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tunnel_origin_url: ${{ vars.TUNNEL_ORIGIN_URL }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_app_zone: ${{ vars.APP_ZONE }}
      TF_VAR_cloudflare_zone_plan: ${{ vars.CLOUDFLARE_ZONE_PLAN }}
      TF_VAR_auth_domain: ${{ vars.AUTH_DOMAIN }}
      TF_VAR_auth_origin_url: ${{ vars.AUTH_ORIGIN_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - working-directory: terraform
        run: terraform init -input=false

      - working-directory: terraform
        run: terraform plan -input=false -no-color -var="region=${{ env.AWS_REGION }}"

  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: ${{ needs.terraform-plan.result == 'success' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.apply_terraform == 'true')) }}
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_tunnel_origin_url: ${{ vars.TUNNEL_ORIGIN_URL }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_app_zone: ${{ vars.APP_ZONE }}
      TF_VAR_cloudflare_zone_plan: ${{ vars.CLOUDFLARE_ZONE_PLAN }}
      TF_VAR_auth_domain: ${{ vars.AUTH_DOMAIN }}
      TF_VAR_auth_origin_url: ${{ vars.AUTH_ORIGIN_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - working-directory: terraform
        run: terraform init -input=false

      - working-directory: terraform
        run: terraform apply -input=false -no-color -auto-approve -var="region=${{ env.AWS_REGION }}"

  kubernetes-apply:
    needs: [changes, build-backend, build-services, build-frontend, terraform-apply]
    runs-on: powerlifting-k8s
    if: >-
      ${{ always()
      && github.event_name != 'pull_request'
      && github.triggering_actor == github.repository_owner
      && github.actor == github.repository_owner
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.kubernetes == 'true'
        || needs.build-backend.result == 'success'
        || needs.build-services.result == 'success'
        || needs.build-frontend.result == 'success') }}
    concurrency:
      group: kubernetes-apply
      cancel-in-progress: false
    env:
      KUBE_LOAD_CONFIG_FILE: "false"
    steps:
      - uses: actions/checkout@v4

      - run: command -v unzip || (sudo apt-get update && sudo apt-get install -y unzip)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - env:
          K8S_TFVARS: ${{ secrets.K8S_TFVARS }}
        run: printf '%s' "$K8S_TFVARS" > "$RUNNER_TEMP/k8s.tfvars"

      - env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        working-directory: terraform/k8s
        run: |
          set -euo pipefail
          for stack in core perms network; do
            terraform -chdir="$stack" init -input=false \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=powerlifting-app/k8s/$stack.tfstate" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="encrypt=true" \
              -backend-config="use_lockfile=true"
            terraform -chdir="$stack" apply -input=false -no-color -auto-approve -var-file="$RUNNER_TEMP/k8s.tfvars"
          done
          terraform -chdir=mesh init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=powerlifting-app/k8s/mesh.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=mesh apply -input=false -no-color -auto-approve -var="region=$AWS_REGION"
          terraform -chdir=app init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=powerlifting-app/k8s/app.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=app apply -input=false -no-color -auto-approve -var-file="$RUNNER_TEMP/k8s.tfvars"
