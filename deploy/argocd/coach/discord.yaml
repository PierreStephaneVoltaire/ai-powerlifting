apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-coach-discord
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
  annotations:
    nolift.io/coach-settings: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pl-coach-discord
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pl-coach-discord
        istio.io/dataplane-mode: ambient
        nolift.io/aws-workload: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: COACH_URL
          value: http://pl-coach.powerlifting.svc.cluster.local:8000
        - name: ASSISTANT_URL
          value: http://pl-assistant.powerlifting.svc.cluster.local:8000
        - name: DISCORD_OPERATOR_ID
          value: nolift:private:discord_operator_id
        - name: OPERATOR_PERSON
          value: nolift:private:operator_person
        - name: DISCORD_PERSONS
          value: nolift:private:discord_persons
        - name: AWS_DEFAULT_REGION
        - name: AWS_EC2_METADATA_DISABLED
        - name: AWS_REGION
        - name: AWS_ROLE_ARN
        - name: AWS_STS_REGIONAL_ENDPOINTS
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
        image: if-powerlifting-coach-discord
        imagePullPolicy: IfNotPresent
        name: relay
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 250m
            memory: 192Mi
          requests:
            cpu: 10m
            memory: 48Mi
        volumeMounts:
        - mountPath: /secrets/aws
          mountPropagation: None
          name: aws
          readOnly: true
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-registry
      securityContext: {}
      serviceAccountName: pl-coach-discord
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
      - name: aws
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: web-identity-token
---
apiVersion: v1
kind: Service
metadata:
  name: pl-coach-discord
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: pl-coach-discord
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: pl-coach-discord
  namespace: powerlifting
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
