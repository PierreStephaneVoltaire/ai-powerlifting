apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-coach
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
  annotations:
    nolift.io/home-node: 'true'
    nolift.io/coach-settings: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pl-coach
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pl-coach
        istio.io/dataplane-mode: ambient
        nolift.io/aws-workload: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: COACH_URL
          value: http://127.0.0.1:8000
        - name: PL_SERVICE_URL_TEMPLATE
          value: http://pl-{domain}.powerlifting.svc.cluster.local:8000
        - name: PL_PROFILE_URL
          value: http://pl-profile.powerlifting.svc.cluster.local:8000
        - name: COACH_PROVIDERS
          value: nolift:private:coach_providers
        - name: COACH_OPERATION_AI
          value: nolift:private:operation_ai
        - name: COACH_PROVIDER_KEYS
          valueFrom:
            secretKeyRef:
              key: COACH_PROVIDER_KEYS
              name: pl-coach-provider-keys
              optional: false
        - name: POWERLIFTING_S3_BUCKET
          value: nolift:private:coach_dataset_bucket
        - name: AWS_DEFAULT_REGION
        - name: AWS_EC2_METADATA_DISABLED
        - name: AWS_REGION
        - name: AWS_ROLE_ARN
        - name: AWS_STS_REGIONAL_ENDPOINTS
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
        image: if-powerlifting-coach-agent
        imagePullPolicy: IfNotPresent
        name: coach
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 1536Mi
          requests:
            cpu: 50m
            memory: 192Mi
        volumeMounts:
        - mountPath: /var/lib/coach
          mountPropagation: None
          name: state
        - mountPath: /secrets/aws
          mountPropagation: None
          name: aws
          readOnly: true
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-registry
      securityContext:
        fsGroup: 10001
        runAsNonRoot: false
      serviceAccountName: pl-coach
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: pl-coach-state
      - name: aws
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: web-identity-token
---
apiVersion: v1
kind: Service
metadata:
  name: pl-coach
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: pl-coach
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: pl-coach
  namespace: powerlifting
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
