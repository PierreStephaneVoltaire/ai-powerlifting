apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- discord.yaml
- mesh.yaml
- network-policy.yaml
replacements:
- source:
    kind: Deployment
    name: pl-coach-discord
    fieldPath: spec.template.spec.containers.[name=relay].image
    options: {delimiter: ':latest@', index: 0}
  targets:
  - select: {kind: Deployment, name: pl-coach-discord}
    fieldPaths: ['metadata.annotations.[nolift.io/relay-image-base]']
    options: {create: true}
- source:
    kind: Deployment
    name: pl-coach-discord
    fieldPath: metadata.annotations.[nolift.io/relay-image-base]
    options: {delimiter: '@', index: 0}
  targets:
  - select: {kind: Deployment, name: pl-coach-discord}
    fieldPaths: ['spec.template.spec.containers.[name=relay].image']
    options: {delimiter: '@', index: 0}
