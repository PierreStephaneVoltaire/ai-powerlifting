apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-analytics
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pl-analytics
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pl-analytics
        istio.io/dataplane-mode: ambient
        nolift.io/aws-workload: 'true'
    spec:
      tolerations:
      - key: nolift.io/pool
        operator: Equal
        value: aws-spot
        effect: NoSchedule
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app: pl-analytics
        matchLabelKeys:
        - pod-template-hash
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PORT
          value: '8000'
        - name: BUILD_ID
          value: from-container-image
        - name: VALKEY_URL
          value: redis://pl-valkey.powerlifting.svc.cluster.local:6379
        - name: ANALYTICS_AI_GRPC_URL
          value: http://pl-analytics-ai.powerlifting.svc.cluster.local:50051
        - name: GRPC_ALLOWED_CALLERS
          value: pl-analytics-ai,pl-analytics-export
        - name: POWERLIFTING_S3_BUCKET
          value: nolift:private:dataset_bucket
        - name: AWS_DEFAULT_REGION
        - name: AWS_EC2_METADATA_DISABLED
        - name: AWS_REGION
        - name: AWS_ROLE_ARN
        - name: AWS_STS_REGIONAL_ENDPOINTS
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
        envFrom:
        - configMapRef:
            name: powerlifting-app-config
            optional: false
        image: if-powerlifting-analytics
        imagePullPolicy: IfNotPresent
        name: analytics
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 50051
          name: grpc
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /secrets/aws
          mountPropagation: None
          name: aws
          readOnly: true
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-registry
      securityContext: {}
      serviceAccountName: pl-analytics
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
      - name: aws
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: web-identity-token
---
apiVersion: v1
kind: Service
metadata:
  name: pl-analytics
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  - appProtocol: grpc
    name: grpc
    port: 50051
    protocol: TCP
    targetPort: 50051
  selector:
    app: pl-analytics
  type: ClusterIP
