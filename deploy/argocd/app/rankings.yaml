apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-rankings
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pl-rankings
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pl-rankings
        istio.io/dataplane-mode: ambient
        nolift.io/aws-workload: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PORT
          value: '8000'
        - name: VALKEY_URL
          value: redis://pl-valkey.powerlifting.svc.cluster.local:6379
        - name: POWERLIFTING_S3_BUCKET
          value: nolift:private:dataset_bucket
        - name: DATA_DIR
          value: /data
        - name: AWS_DEFAULT_REGION
        - name: AWS_EC2_METADATA_DISABLED
        - name: AWS_REGION
        - name: AWS_ROLE_ARN
        - name: AWS_STS_REGIONAL_ENDPOINTS
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
        envFrom:
        - configMapRef:
            name: powerlifting-app-config
            optional: false
        image: if-powerlifting-rankings
        imagePullPolicy: IfNotPresent
        name: rankings
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
        - mountPath: /secrets/aws
          mountPropagation: None
          name: aws
          readOnly: true
        - mountPath: /data
          mountPropagation: None
          name: data
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-registry
      securityContext: {}
      serviceAccountName: pl-rankings
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
      - name: aws
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: web-identity-token
      - emptyDir:
          sizeLimit: 1Gi
        name: data
---
apiVersion: v1
kind: Service
metadata:
  name: pl-rankings
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: pl-rankings
  type: ClusterIP
