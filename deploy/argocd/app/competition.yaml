apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-competition
  namespace: powerlifting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pl-competition
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pl-competition
        istio.io/dataplane-mode: ambient
        nolift.io/aws-workload: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PORT
          value: '8000'
        - name: HTTP_ADDR
          value: :8000
        - name: GOMEMLIMIT
          value: 100MiB
        - name: PL_PROFILE_URL
          value: http://pl-profile.powerlifting.svc.cluster.local:8000
        - name: VALKEY_URL
          value: redis://pl-valkey.powerlifting.svc.cluster.local:6379
        - name: AWS_DEFAULT_REGION
        - name: AWS_EC2_METADATA_DISABLED
        - name: AWS_REGION
        - name: AWS_ROLE_ARN
        - name: AWS_STS_REGIONAL_ENDPOINTS
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
        - name: PL_JOB_TOKEN_PUBLIC_KEY
          value: nolift:private:job_token_public_key
        envFrom:
        - configMapRef:
            name: powerlifting-app-config
            optional: false
        image: if-powerlifting-competition
        imagePullPolicy: IfNotPresent
        name: competition
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        volumeMounts:
        - mountPath: /secrets/aws
          mountPropagation: None
          name: aws
          readOnly: true
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-registry
      securityContext: {}
      serviceAccountName: pl-competition
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
      - name: aws
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: web-identity-token
---
apiVersion: v1
kind: Service
metadata:
  name: pl-competition
  namespace: powerlifting
  labels:
    istio.io/use-waypoint: nolift-waypoint
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: pl-competition
  type: ClusterIP
