apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: powerlifting
  annotations:
    nolift.io/legacy-cookie: 'true'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: oauth2-proxy
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oauth2-proxy
        istio.io/dataplane-mode: ambient
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --http-address=0.0.0.0:4180
        - --reverse-proxy=true
        - --provider=oidc
        - --email-domain=*
        - --redirect-url=https://$(APP_DOMAIN)/oauth2/callback
        - --upstream=http://powerlifting-app-backend.powerlifting.svc.cluster.local:3005/
        - --scope=openid profile email groups roles powerlifting_identity offline_access
        - --code-challenge-method=S256
        - --insecure-oidc-skip-nonce=false
        - --cookie-refresh=1m
        - --cookie-name=__Host-pl_oauth2_proxy
        - --cookie-secure=true
        - --cookie-httponly=true
        - --cookie-samesite=lax
        - --session-store-type=redis
        - --redis-connection-url=redis://pl-valkey.powerlifting.svc.cluster.local:6379
        - --pass-authorization-header=true
        - --api-route=^/api/.*$
        - --skip-auth-route=POST=^/api/auth/logout$
        - --skip-auth-route=GET=^/api/
        - --upstream-timeout=300s
        - --skip-provider-button=true
        - --insecure-oidc-allow-unverified-email=true
        - --silence-ping-logging=true
        env:
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          valueFrom:
            configMapKeyRef:
              key: AUTHENTIK_ISSUER_URL
              name: powerlifting-app-config
              optional: false
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: AUTHENTIK_CLIENT_ID
              name: powerlifting-app-config
              optional: false
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: OAUTH2_PROXY_CLIENT_SECRET
              name: oauth2-proxy-secrets
              optional: false
        - name: OAUTH2_PROXY_COOKIE_SECRET
          value: ''
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secrets
              key: OAUTH2_PROXY_COOKIE_SECRET
        - name: APP_DOMAIN
          value: nolift:private:app_domain
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
        imagePullPolicy: IfNotPresent
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: 4180
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: oauth2-proxy
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: powerlifting
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    app: oauth2-proxy
  type: ClusterIP
