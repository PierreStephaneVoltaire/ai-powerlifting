---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: nolift-waypoint-source-principal
  namespace: powerlifting
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  configPatches:
  - applyTo: HTTP_FILTER
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.http.lua
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          inlineCode: |
            function envoy_on_request(request_handle)
              local headers = request_handle:headers()
              headers:remove("x-pl-source-principal")
              local state = request_handle:streamInfo():filterState()
              if not state then return end
              local principal = state:get("io.istio.peer_principal")
              if principal then headers:replace("x-pl-source-principal", principal) end
            end
  priority: 10
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: nolift-waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nolift-waypoint
  namespace: powerlifting
  labels:
    istio.io/waypoint-for: service
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: mesh
    port: 15008
    protocol: HBONE
