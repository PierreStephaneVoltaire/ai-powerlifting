apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecr-token-refresher-isolation
  namespace: powerlifting
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    nolift.io/isolation: ecr-token-refresher
spec:
  egress:
  - ports:
    - port: 15008
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: nolift-waypoint
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  ingress:
  - from:
    - ipBlock:
        cidr: 169.254.7.127/32
  podSelector:
    matchLabels:
      app: ecr-token-refresher
  policyTypes:
  - Ingress
  - Egress
