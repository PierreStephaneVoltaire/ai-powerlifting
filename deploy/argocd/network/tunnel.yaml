apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: powerlifting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/token: nolift:private:tunnel_checksum
      labels:
        app: cloudflared
        istio.io/dataplane-mode: ambient
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - tunnel
        - --no-autoupdate
        - --protocol
        - http2
        - --metrics
        - 0.0.0.0:2000
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: cloudflared-token
              optional: false
        image: cloudflare/cloudflared:2024.10.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 2000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: cloudflared
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      enableServiceLinks: true
      securityContext: {}
      serviceAccountName: cloudflared
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
