apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-node-termination-handler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-node-termination-handler
    app.kubernetes.io/instance: aws-node-termination-handler
    app.kubernetes.io/version: 1.25.6
    app.kubernetes.io/part-of: aws-node-termination-handler
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: aws-node-termination-handler
  labels:
    app.kubernetes.io/name: aws-node-termination-handler
    app.kubernetes.io/instance: aws-node-termination-handler
    app.kubernetes.io/version: 1.25.6
    app.kubernetes.io/part-of: aws-node-termination-handler
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
  - get
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - extensions
  resources:
  - daemonsets
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: aws-node-termination-handler
  labels:
    app.kubernetes.io/name: aws-node-termination-handler
    app.kubernetes.io/instance: aws-node-termination-handler
    app.kubernetes.io/version: 1.25.6
    app.kubernetes.io/part-of: aws-node-termination-handler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-node-termination-handler
subjects:
- kind: ServiceAccount
  name: aws-node-termination-handler
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-node-termination-handler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-node-termination-handler
    app.kubernetes.io/instance: aws-node-termination-handler
    app.kubernetes.io/version: 1.25.6
    app.kubernetes.io/part-of: aws-node-termination-handler
    app.kubernetes.io/component: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-node-termination-handler
      app.kubernetes.io/instance: aws-node-termination-handler
      app.kubernetes.io/component: deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-node-termination-handler
        app.kubernetes.io/instance: aws-node-termination-handler
        app.kubernetes.io/component: deployment
        k8s-app: aws-node-termination-handler
    spec:
      serviceAccountName: aws-node-termination-handler
      securityContext:
        fsGroup: 1000
      priorityClassName: system-cluster-critical
      containers:
      - name: aws-node-termination-handler
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        image: public.ecr.aws/aws-ec2/aws-node-termination-handler:v1.25.6
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ENABLE_PROBES_SERVER
          value: 'true'
        - name: PROBES_SERVER_PORT
          value: '8080'
        - name: PROBES_SERVER_ENDPOINT
          value: /healthz
        - name: LOG_LEVEL
          value: info
        - name: JSON_LOGGING
          value: 'false'
        - name: LOG_FORMAT_VERSION
          value: '1'
        - name: ENABLE_PROMETHEUS_SERVER
          value: 'false'
        - name: PROMETHEUS_SERVER_PORT
          value: '9092'
        - name: CHECK_ASG_TAG_BEFORE_DRAINING
          value: 'true'
        - name: CHECK_TAG_BEFORE_DRAINING
          value: 'true'
        - name: MANAGED_ASG_TAG
          value: aws-node-termination-handler/managed
        - name: MANAGED_TAG
          value: aws-node-termination-handler/managed
        - name: USE_PROVIDER_ID
          value: 'true'
        - name: DRY_RUN
          value: 'false'
        - name: CORDON_ONLY
          value: 'false'
        - name: TAINT_NODE
          value: 'false'
        - name: ENABLE_OUT_OF_SERVICE_TAINT
          value: 'false'
        - name: EXCLUDE_FROM_LOAD_BALANCERS
          value: 'false'
        - name: DELETE_LOCAL_DATA
          value: 'true'
        - name: IGNORE_DAEMON_SETS
          value: 'true'
        - name: POD_TERMINATION_GRACE_PERIOD
          value: '-1'
        - name: NODE_TERMINATION_GRACE_PERIOD
          value: '120'
        - name: EMIT_KUBERNETES_EVENTS
          value: 'false'
        - name: COMPLETE_LIFECYCLE_ACTION_DELAY_SECONDS
          value: '-1'
        - name: ENABLE_SQS_TERMINATION_DRAINING
          value: 'true'
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: node-termination-handler-aws
              key: region
        - name: QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: node-termination-handler-aws
              key: queue_url
        - name: DELETE_SQS_MSG_IF_NODE_NOT_FOUND
          value: 'false'
        - name: WORKERS
          value: '10'
        - name: HEARTBEAT_INTERVAL
          value: '-1'
        - name: HEARTBEAT_UNTIL
          value: '-1'
        - name: SQS_MSG_VISIBILITY_TIMEOUT_SEC
          value: '20'
        - name: AWS_ROLE_ARN
          valueFrom:
            secretKeyRef:
              name: node-termination-handler-aws
              key: role_arn
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /secrets/aws/token
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        - name: AWS_STS_REGIONAL_ENDPOINTS
          value: regional
        ports:
        - name: liveness-probe
          protocol: TCP
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: aws-token
          mountPath: /secrets/aws
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: aws-token
        projected:
          sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: token
