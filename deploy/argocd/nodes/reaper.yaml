apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-reaper
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nolift-node-reaper
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nolift-node-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nolift-node-reaper
subjects:
- kind: ServiceAccount
  name: node-reaper
  namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-reaper
  namespace: kube-system
spec:
  schedule: '*/10 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: node-reaper
          restartPolicy: Never
          containers:
          - name: reaper
            image: public.ecr.aws/aws-cli/aws-cli:2.37.0
            command: [/bin/sh, -c]
            args:
            - |
              set -eu
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              api=https://kubernetes.default.svc
              token=$(cat "$sa/token")
              curl -fsS --cacert "$sa/ca.crt" -H "Authorization: Bearer $token" --get --data-urlencode 'labelSelector=nolift.io/pool=aws-spot' "$api/api/v1/nodes" > /tmp/nodes.json
              jq -c '.items[] | select(any(.status.conditions[]?; .type == "Ready" and (.status == "False" or .status == "Unknown") and (try ((.lastTransitionTime[0:19] + "Z" | fromdateiso8601) < (now - 600)) catch false))) | .metadata | {name, uid, resourceVersion}' /tmp/nodes.json > /tmp/stale-nodes.jsonl
              while IFS= read -r node; do
                name=$(printf '%s' "$node" | jq -r '.name')
                options=$(printf '%s' "$node" | jq -c '{apiVersion:"v1",kind:"DeleteOptions",preconditions:{uid:.uid,resourceVersion:.resourceVersion}}')
                status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' --cacert "$sa/ca.crt" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -X DELETE -d "$options" "$api/api/v1/nodes/$name")
                case "$status" in 200|202|404|409) ;; *) cat /tmp/delete-response >&2; exit 1 ;; esac
              done < /tmp/stale-nodes.jsonl
              ts_token=$(curl -fsS -X POST https://api.tailscale.com/api/v2/oauth/token --data-urlencode "client_id=$TAILSCALE_CLIENT_ID" --data-urlencode "client_secret=$TAILSCALE_CLIENT_SECRET" --data-urlencode 'grant_type=client_credentials' | jq -er '.access_token')
              curl -fsS -H "Authorization: Bearer $ts_token" https://api.tailscale.com/api/v2/tailnet/-/devices > /tmp/devices.json
              jq -r --slurpfile nodes /tmp/nodes.json '.devices[] | select((.tags // []) | index("tag:k3s-worker")) | select(.connectedToControl == false) | select(try ((.lastSeen[0:19] + "Z" | fromdateiso8601) < (now - 600)) catch false) | select(.hostname as $name | all($nodes[0].items[]; .metadata.name != $name or (any(.status.conditions[]?; .type == "Ready" and .status == "True") | not))) | .nodeId | select(type == "string" and test("^[A-Za-z0-9_-]+$"))' /tmp/devices.json > /tmp/stale-devices
              while IFS= read -r device; do
                curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $ts_token" "https://api.tailscale.com/api/v2/device/$device"
              done < /tmp/stale-devices
            env:
            - name: TAILSCALE_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: node-reaper-tailscale, key: client_id}
            - name: TAILSCALE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: node-reaper-tailscale, key: client_secret}
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {cpu: 200m, memory: 128Mi}
