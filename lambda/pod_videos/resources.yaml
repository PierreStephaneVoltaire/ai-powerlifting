layers:
- pl_boto3
- pl_sessions
min_replicas: 0
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 1Gi
timeout: 900
description: Session video library, upload, metadata, thumbnail, and removal operations.
input_schema:
  type: object
  properties:
    function:
      type: string
      enum:
      - video_library_get
      - video_remove
      - video_update_metadata
      - video_media_resolve
  required:
  - function
