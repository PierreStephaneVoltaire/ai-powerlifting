version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: powerlifting/analytics-export/gen/analytics
plugins:
  - local: protoc-gen-go
    out: gen/analytics
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/analytics
    opt: paths=source_relative
