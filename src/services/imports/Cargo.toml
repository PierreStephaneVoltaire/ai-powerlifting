[package]
name = "pl-imports"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
aws-sdk-dynamodb = "1.116.0"
aws-config = "1.8.18"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
jsonschema = "0.61.1"
regex = "1.12.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["v4", "v5"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[dev-dependencies]
p256 = "0.13.2"
rand_core = { version = "0.6", features = ["getrandom"] }
