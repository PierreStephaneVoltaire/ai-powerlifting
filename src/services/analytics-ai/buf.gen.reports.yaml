version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: powerlifting/analytics-ai/gen/reports
plugins:
  - local: protoc-gen-go
    out: gen/reports
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/reports
    opt: paths=source_relative
