version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: powerlifting/analytics-ai/gen/export
plugins:
  - local: protoc-gen-go
    out: gen/export
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/export
    opt: paths=source_relative
