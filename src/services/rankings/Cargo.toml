[package]
name = "pl-rankings"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
aws-config = "1.8.18"
aws-sdk-s3 = "1.137.0"
axum = { version = "0.8.9", features = ["json"] }
hex = "0.4.3"
jsonschema = "0.61.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
mimalloc = "0.1.52"
polars = { version = "=0.53.0", default-features = false, features = ["lazy", "new_streaming", "parquet", "csv", "dtype-categorical", "strings", "temporal"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
