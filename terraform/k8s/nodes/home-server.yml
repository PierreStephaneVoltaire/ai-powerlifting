- name: Connect the k3s server to Tailscale
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Read server join credential
      ansible.builtin.command:
        argv: [k3s, kubectl, -n, cattle-system, get, secret, nolift-tailnet-server, -o, 'jsonpath={.data.key}']
      register: join_secret
      changed_when: false
      no_log: true
    - name: Add Tailscale signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
    - name: Add Tailscale package repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main
        filename: tailscale
    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
    - name: Join the tailnet
      ansible.builtin.command:
        argv: [tailscale, up, '--auth-key={{ join_secret.stdout | b64decode }}', '--advertise-tags=tag:k3s-server', '--hostname=nolift-k3s-server', '--port=41641']
      no_log: true
    - name: Disable Tailscale automatic updates
      ansible.builtin.command: tailscale set --auto-update=false
    - name: Get the Tailscale address
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false
    - name: Create configuration directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop: [/etc/rancher/k3s/config.yaml.d, /etc/systemd/system/k3s.service.d, /etc/systemd/system/tailscaled.service.d]
    - name: Configure k3s networking
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/zzzz-nolift-tailnet.yaml
        mode: '0600'
        content: |
          node-ip: {{ tailscale_ip.stdout }}
          flannel-iface: tailscale0
          tls-san+:
            - nolift-k3s-server
            - {{ tailscale_ip.stdout }}
            - {{ ansible_default_ipv4.address }}
    - name: Configure k3s service ordering
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/nolift-tailnet.conf
        mode: '0644'
        content: "[Unit]\nAfter=tailscaled.service\nWants=tailscaled.service\n"
    - name: Restart k3s when Tailscale restarts
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscaled.service.d/nolift-k3s.conf
        mode: '0644'
        content: "[Service]\nExecStartPost=/bin/systemctl --no-block try-restart k3s.service\n"
    - name: Restart k3s with the new configuration
      ansible.builtin.systemd_service:
        name: k3s
        daemon_reload: true
        state: restarted
    - name: Wait for the Kubernetes API
      ansible.builtin.command: k3s kubectl --request-timeout=5s get --raw /readyz
      register: ready
      until: ready.rc == 0
      retries: 36
      delay: 5
      changed_when: false
    - name: Wait for the control plane to use its Tailscale address
      ansible.builtin.command:
        argv: [k3s, kubectl, --request-timeout=5s, get, nodes, -l, node-role.kubernetes.io/control-plane, -o, json]
      register: control_plane
      until: >-
        control_plane.rc == 0 and
        (control_plane.stdout | from_json).items | length == 1 and
        ((control_plane.stdout | from_json).items[0].status.addresses | selectattr('type', 'equalto', 'InternalIP') | selectattr('address', 'equalto', tailscale_ip.stdout) | list | length) == 1 and
        ((control_plane.stdout | from_json).items[0].status.conditions | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length) == 1
      retries: 36
      delay: 5
      changed_when: false
